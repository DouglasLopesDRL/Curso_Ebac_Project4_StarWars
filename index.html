<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Star Wars</title>
    <link rel="stylesheet" href="./dist/css/main.css">
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__content__branding">
                <img src="src/images/starwars.png" alt="Logo Star Wars">
            </h1>
            <h3 class="title--small">
                Bem-vindo ao Universo Star Wars
            </h3>
            <p>
                <span class="text--medium">
                    Escolha seu lado da força!
                    Que a força esteja com você...
                </span>
            </p>
            <ul class="hero__content__ladosdaforca">
                <li class="hero__content__ladosdaforca__lado">
                    <img src="dist/images/logos/lado_da_forca.png" alt="Caminho da Força">
                    <button>Lado da Força</button>
                    <span class="text--small">Se torne um Jedi</span>
                </li>
                <li class="hero__content__ladosdaforca__lado">
                    <img src="dist/images/logos/lado_sombrio_da_forca.png" alt="Lado Sombrio da Força">
                    <button>Lado Sombrio</button>
                    <span class="text--small">Se torne um Sith</span>
                </li>
            </ul>

        </div>
    </section>
    <section class="shows">
        <nav class="shows__tabs">
            <button data-tab-button="filmes" class="shows__tabs__button shows__tabs__button--is-active">
                Filmes
            </button>
            <button data-tab-button="series" class="shows__tabs__button">
                Séries
            </button>
            <button data-tab-button="jogos" class="shows__tabs__button">
                Jogos
            </button>
        </nav>
        <!-- ... Lista de Filmes ... -->
        <ul data-tab-id="filmes" class="shows__list shows__list--is-active">
            <li class="shows__list__item">
                <img src="./dist/images/shows/episodio_i.png" alt="Star Wars Episódio I - A Ameaça Fantasma">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/episodio_ii.png" alt="Star Wars Episódio II - O Ataque dos Clones">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/episodio_iii.png" alt="Star Wars Episódio III - A Vingança dos Sith">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/episodio_iv.png" alt="Star Wars Episódio IV - Uma Nova Esperança">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/episodio_v.png" alt="Star Wars Episódio V - O Império Contra-Ataca">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/episodio_vi.png" alt="Star Wars Episódio VI - O Retorno do Jedi">
            </li>
        </ul>
        <!-- ... Lista de Series ... -->
        <ul data-tab-id="series" class="shows__list">
            <li class="shows__list__item">
                <img src="./dist/images/shows/mandaloriano.jpeg" alt="Star Wars - The Mandalorian">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/obi_wan_kenobi.jpg" alt="Star Wars - Obi-Wan Kenobi">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/skeleton_crew.jpg" alt="Star Wars - Skeleton Crew">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/visions.png" alt="Star Wars - Visions">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/ahsoka.jpg" alt="Star Wars - Ahsoka">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/andor.jpeg" alt="Star Wars - Andor">
            </li>
        </ul>
        <!-- ... Lista de Jogos ... -->
        <ul data-tab-id="jogos" class="shows__list">
            <li class="shows__list__item">
                <img src="./dist/images/shows/jogo_jedi-fallen-order.jpeg" alt="Star Wars - Jedi Fallen Order">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/jogo_jedi-survivor.png" alt="Star Wars - Jedi Survivor">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/jogo_force-unleashed.png" alt="Star Wars - Force Unleashed">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/jogo_lego-skywaler-saga.jpeg" alt="Star Wars - LEGO Star Wars Saga">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/jogo_star-wars-outlaws.jpg" alt="Star Wars - Star Wars Outlaws">
            </li>
            <li class="shows__list__item">
                <img src="./dist/images/shows/jogo_zero-company.png" alt="Star Wars - Zero Company">
            </li>
        </ul>
    </section>
    
    </section>
    <script src="./src/main.js"></script>
</body>
</html>
