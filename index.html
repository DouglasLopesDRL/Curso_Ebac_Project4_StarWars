<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Star Wars</title>
    <link rel="stylesheet" href="./dist/css/main.css">
</head>
<body>
    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__content__branding">
                <img src="src/images/starwars.png" alt="Logo Star Wars">
            </h1>
            <h3 class="title--small">
                Bem-vindo ao Universo Star Wars
            </h3>
            <p>
                <span class="text--medium">
                    Escolha seu lado da força!
                    Que a força esteja com você...
                </span>
            </p>
            <ul class="hero__content__ladosdaforca">
                <li class="hero__content__ladosdaforca__lado">
                    <img src="dist/images/logos/lado_da_forca.png" alt="Caminho da Força">
                    <button>Lado da Força</button>
                    <span class="text--small">Se torne um Jedi</span>
                </li>
                <li class="hero__content__ladosdaforca__lado">
                    <img src="dist/images/logos/lado_sombrio_da_forca.png" alt="Lado Sombrio da Força">
                    <button>Lado Sombrio</button>
                    <span class="text--small">Se torne um Sith</span>
                </li>
            </ul>

        </div>
    </section>
    
</body>
</html>
